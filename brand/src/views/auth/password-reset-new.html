<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 비밀번호 설정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

    <!-- Header (auth 공통, H105px) -->
    <header class="auth-header">
        <a href="#"><img class="auth-header__logo" src="../../images/logo-white.svg" alt="쏠쏠"></a>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2 class="auth-card__title">새 비밀번호를 설정하세요</h2>
            <p class="auth-card__desc">보안을 위해 이전에 사용하지 않은 새로운 비밀번호를<br>설정해 주세요.</p>

            <form class="auth-form">
                <div class="auth-field">
                    <label class="auth-field__label" for="new-password">새 비밀번호</label>
                    <div class="input-box input-box--fill">
                        <img class="input-box__icon" src="../../images/ico-fi-sr-lock.svg" alt="">
                        <input type="password" id="new-password" placeholder="새 비밀번호를 입력하세요">
                        <img class="input-box__icon" src="../../images/ico-eye.svg" alt="비밀번호 표시">
                    </div>
                    <div class="auth-strength">
                        <span class="auth-strength__bar"></span>
                        <span class="auth-strength__bar"></span>
                        <span class="auth-strength__bar"></span>
                        <span class="auth-strength__bar"></span>
                    </div>
                    <p class="auth-field__help">8~16자, 영문 대소문자·숫자·특수문자 조합 필수</p>
                </div>

                <div class="auth-field">
                    <label class="auth-field__label" for="new-password-confirm">새 비밀번호</label>
                    <div class="input-box input-box--fill">
                        <img class="input-box__icon" src="../../images/ico-fi-sr-lock.svg" alt="">
                        <input type="password" id="new-password-confirm" placeholder="비밀번호를 한 번 더 입력하세요">
                        <img class="input-box__icon" src="../../images/ico-eye.svg" alt="비밀번호 표시">
                    </div>
                </div>

                <button type="submit" class="btn btn--primary">비밀번호 변경 완료하기</button>

                <a class="auth-back" href="#">
                    <img src="../../images/arrow-right-circle.svg" alt="">
                    <span><span class="auth-back__link">로그인</span> 화면으로 돌아가기</span>
                </a>
            </form>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

    <!-- Header (auth 공통, H105px) -->
    <header class="auth-header">
        <a href="#"><img class="auth-header__logo" src="../../images/logo-white.svg" alt="쏠쏠"></a>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2 class="auth-card__title">비밀번호 재설정하기</h2>
            <p class="auth-card__desc">가입하신 이메일 주소를 입력하시면,<br>비밀번호를 재설정할 수 있는 이메일 인증를 보내드립니다.</p>

            <form class="auth-form">
                <div class="auth-field">
                    <label class="auth-field__label" for="email">이메일 주소</label>
                    <div class="input-box">
                        <input type="email" id="email" placeholder="아이디로 등록된 이메일을 입력해 주세요">
                    </div>
                </div>

                <div class="auth-remember">
                    <label class="c-check">
                        <input type="checkbox"><span class="c-check__box"></span>아이디 기억하기
                    </label>
                </div>

                <button type="submit" class="btn btn--primary">인증 메일 발송하기</button>
            </form>
        </div>
    </main>

</body>
</html>

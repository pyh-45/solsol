<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 완료 (쏠쏠 바로가기)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

    <!-- Header (auth 공통, H105px) -->
    <header class="auth-header">
        <a href="#"><img class="auth-header__logo" src="../../images/logo-white.svg" alt="쏠쏠"></a>
    </header>

    <main class="auth-main">
        <div class="auth-card auth-welcome">

            <h1 class="auth-welcome__title">환영합니다!</h1>
            <p class="auth-welcome__lead">쏠쏠 회원가입이 완료되었습니다.</p>
            <p class="auth-welcome__sub">이제 YouTube 크리에이터를 위한 최고의 학습 플랫폼을 경험해보세요!</p>

            <!-- 계정 정보 -->
            <div class="auth-account">
                <p class="auth-account__label">이메일</p>
                <p class="auth-account__email">user@example.com</p>
                <span class="auth-account__plan">Free</span>
            </div>

            <!-- 안내 바 -->
            <p class="auth-notice">1분 만에 만드는 내 사이트, 바로 만들어 보세요</p>

            <a class="btn btn--primary auth-welcome__btn" href="#">쏠쏠 바로가기</a>

            <!-- 시작 가이드 -->
            <div class="auth-steps">
                <div class="auth-steps__item">
                    <span class="auth-steps__title">1. 내 사이트 관리하기</span>
                    <span class="auth-steps__desc">나만의 학습 사이트를 빠르게 구축하세요</span>
                </div>
                <div class="auth-steps__item">
                    <span class="auth-steps__title">2. 첫 강좌 업로드</span>
                    <span class="auth-steps__desc">YouTube 영상 링크, 또는 직접 영상을 업로드 하세요</span>
                </div>
                <div class="auth-steps__item">
                    <span class="auth-steps__title">3. YouTube 연동</span>
                    <span class="auth-steps__desc">멤버십 회원을 쉽게 초대해 보세요</span>
                </div>
            </div>

        </div>
    </main>

</body>
</html>

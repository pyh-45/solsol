<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 이메일 인증코드 메일</title>
</head>
<body style="margin:0; padding:40px 20px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#333333; background:#F2F3F5; -webkit-font-smoothing:antialiased;">

    <!-- Wrapper (W630) -->
    <div style="width:630px; max-width:100%; margin:0 auto; background:#FFFFFF; border-radius:16px; overflow:hidden;">

        <!-- Head (로고, H100) -->
        <div style="height:100px; padding:0 30px; background:#0E0E10; display:flex; align-items:center;">
            <img src="../../images/logo-white.svg" alt="쏠쏠" width="108" style="display:block; width:108px; height:auto;">
        </div>

        <!-- Body (padding 30) -->
        <div style="padding:30px;">

            <h1 style="margin:0 0 20px; font-size:24px; font-weight:700; line-height:1.4; color:#222222;">이메일 인증</h1>

            <p style="margin:0 0 10px; font-size:16px; font-weight:700; color:#222222;">안녕하세요. 쏠쏠입니다.</p>
            <p style="margin:0; font-size:14px; line-height:1.7; color:#555555;">
                회원가입을 위한 이메일 인증을 위한 번호를 보내드립니다.<br>
                아래 번호를 인증번호란에 입력 후 회원가입을 완료해 주세요.
            </p>

            <!-- 인증코드 -->
            <div style="display:flex; gap:8px; margin:28px 0 16px;">
                <div style="flex:1; height:88px; border-radius:8px; background:#F5F5F5; text-align:center; line-height:88px; font-size:48px; font-weight:700; color:#ED1B23;">4</div>
                <div style="flex:1; height:88px; border-radius:8px; background:#F5F5F5; text-align:center; line-height:88px; font-size:48px; font-weight:700; color:#ED1B23;">0</div>
                <div style="flex:1; height:88px; border-radius:8px; background:#F5F5F5; text-align:center; line-height:88px; font-size:48px; font-weight:700; color:#ED1B23;">0</div>
                <div style="flex:1; height:88px; border-radius:8px; background:#F5F5F5; text-align:center; line-height:88px; font-size:48px; font-weight:700; color:#ED1B23;">0</div>
                <div style="flex:1; height:88px; border-radius:8px; background:#F5F5F5; text-align:center; line-height:88px; font-size:48px; font-weight:700; color:#ED1B23;">3</div>
                <div style="flex:1; height:88px; border-radius:8px; background:#F5F5F5; text-align:center; line-height:88px; font-size:48px; font-weight:700; color:#ED1B23;">9</div>
            </div>
            <p style="margin:0; text-align:center; font-size:17px; font-weight:600; color:#222222;">위 인증코드가 이메일로 발송되었습니다.</p>

            <hr style="margin:30px 0; border:0; border-top:1px solid #EAEAEA;">

            <!-- Footer -->
            <div style="text-align:center; font-size:13px; line-height:1.8; color:#AAAAAA;">
                본 메일은 발신 전용 메일이므로 회신 메일에 응답할 수 없습니다.
                <div style="margin:8px 0;">
                    <a href="#" style="display:inline-block; padding:4px 6px; border-radius:6px; background:#B3B3B3; color:#FFFFFF; font-size:10px; font-weight:500; text-decoration:none;">수신 거부하기</a>
                </div>
                <span style="color:#424242;">© Solsol. All rights reserved.</span>
            </div>

        </div>
    </div>

</body>
</html>

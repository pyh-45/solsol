<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - 로그인</title>
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

<div class="auth-split">

    <!-- 좌측: 비주얼 패널 -->
    <div class="auth-split__visual">

        <div class="auth-split__figure">
            <img src="../../images/img-login-dashboard.png" alt="관리자 대시보드 미리보기">
        </div>

        <div class="auth-split__points">
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                수강생 관리
            </span>
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                강의 운영
            </span>
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                매출 정산
            </span>
        </div>

        <h1 class="auth-split__title">강의도, 정산도,<br>여기서 한번에</h1>
        <p class="auth-split__desc">수강생 관리부터 강의 운영, 매출 정산까지 한 화면에서 이어집니다</p>

    </div>

    <!-- 우측: 로그인 폼 -->
    <div class="auth-split__form">
        <div class="auth-container">

            <!-- 로고 -->
            <div class="auth-logo">DJ테크트리</div>

            <!-- 입력 영역 -->
            <div class="auth-body">
                <div class="auth-tabs">
                    <input type="radio" name="auth-role" id="role-teacher" value="teacher" class="auth-tab-radio">
                    <label for="role-teacher" class="auth-tab">
                        <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
                            <path d="M2.5 8L6 11.5L13.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        강사
                    </label>
                    <input type="radio" name="auth-role" id="role-manager" value="manager" class="auth-tab-radio" checked>
                    <label for="role-manager" class="auth-tab">
                        <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
                            <path d="M2.5 8L6 11.5L13.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        관리자
                    </label>
                </div>

                <div class="auth-field-group">
                    <label class="auth-field-label" for="auth-email">이메일</label>
                    <div class="auth-field">
                        <img src="../../images/form-ico-mail.svg" width="16" height="16" alt="">
                        <input type="email" id="auth-email" class="auth-field__input" placeholder="example@email.com">
                    </div>
                </div>

                <div class="auth-field-group">
                    <label class="auth-field-label" for="auth-password">비밀번호</label>
                    <div class="auth-field">
                        <img src="../../images/form-ico-lock.svg" width="16" height="16" alt="">
                        <input type="password" id="auth-password" class="auth-field__input" value="ekdkjtkdio@!#0123456" placeholder="비밀번호를 입력하세요">
                        <button type="button" class="auth-field__eye" onclick="togglePassword(this, 'auth-password')">
                            <img src="../../images/form-ico-eye.svg" width="16" height="16" alt="비밀번호 표시">
                        </button>
                    </div>
                </div>

                <label class="auth-remember">
                    <input type="checkbox" class="c-check" checked>
                    이메일 기억하기
                </label>
            </div>

            <!-- 버튼 및 기타 -->
            <div class="auth-footer">
                <button type="button" class="btn big">로그인</button>
                <hr class="auth-divider">
                <p class="auth-help">비밀번호가 생각나지 않으신다면<a href="password-forgot-visual.html">비밀번호 재설정</a></p>
            </div>

        </div>
    </div>

</div>

<script>
function togglePassword(btn, targetId) {
    var input = document.getElementById(targetId);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.style.opacity = input.type === 'text' ? '1' : '';
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - 비밀번호 찾기</title>
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

<div class="auth-split">

    <!-- 좌측: 비주얼 패널 -->
    <div class="auth-split__visual">

        <div class="auth-split__figure">
            <img src="../../images/img-login-dashboard.png" alt="관리자 대시보드 미리보기">
        </div>

        <div class="auth-split__points">
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                수강생 관리
            </span>
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                강의 운영
            </span>
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                매출 정산
            </span>
        </div>

        <h1 class="auth-split__title">강의도, 정산도,<br>여기서 한번에</h1>
        <p class="auth-split__desc">수강생 관리부터 강의 운영, 매출 정산까지 한 화면에서 이어집니다</p>

    </div>

    <!-- 우측: 비밀번호 재설정 폼 -->
    <div class="auth-split__form">
        <div class="auth-container">

            <!-- 로고 -->
            <div class="auth-logo">DJ테크트리</div>

            <!-- 입력 영역 -->
            <div class="auth-body">
                <div class="auth-tabs">
                    <input type="radio" name="auth-role" id="role-teacher" value="teacher" class="auth-tab-radio" checked>
                    <label for="role-teacher" class="auth-tab">
                        <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
                            <path d="M2.5 8L6 11.5L13.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        강사
                    </label>
                    <input type="radio" name="auth-role" id="role-manager" value="manager" class="auth-tab-radio">
                    <label for="role-manager" class="auth-tab">
                        <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
                            <path d="M2.5 8L6 11.5L13.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        관리자
                    </label>
                </div>

                <hr class="auth-divider-bold auth-divider--my10">

                <!-- 제목 및 설명 -->
                <div class="auth-forgot-header">
                    <h2 class="auth-title">비밀번호 재설정하기</h2>
                    <p class="auth-forgot-desc">가입하신 이메일 주소를 입력하시면,<br>비밀번호를 재설정할 수 있는 인증 메일을 보내드립니다.</p>
                </div>

                <!-- 이메일 주소 -->
                <div class="auth-field-group">
                    <label class="auth-field-label" for="auth-email">이메일 주소</label>
                    <div class="auth-field">
                        <img src="../../images/form-ico-mail.svg" width="16" height="16" alt="">
                        <input type="email" id="auth-email" class="auth-field__input" placeholder="admin@example.com">
                    </div>
                </div>
            </div>

            <!-- 버튼 및 기타 -->
            <div class="auth-footer">
                <button type="button" class="btn big" disabled>인증 메일 발송</button>
                <hr class="auth-divider">
                <p class="auth-help auth-help--back">
                    <img src="../../images/arrow-right-auth.svg" width="16" height="16" alt="">
                    <span><a href="login-visual.html">로그인</a> 화면으로 돌아가기</span>
                </p>
            </div>

        </div>
    </div>

</div>

</body>
</html>

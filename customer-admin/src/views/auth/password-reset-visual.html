<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - 새 비밀번호 설정</title>
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

<div class="auth-split">

    <!-- 좌측: 비주얼 패널 -->
    <div class="auth-split__visual">

        <div class="auth-split__figure">
            <img src="../../images/img-login-dashboard.png" alt="관리자 대시보드 미리보기">
        </div>

        <div class="auth-split__points">
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                수강생 관리
            </span>
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                강의 운영
            </span>
            <span class="auth-split__point">
                <svg width="21" height="16" viewBox="0 0 16 12" fill="none" aria-hidden="true">
                    <path d="M1.5 6L6 10.5L14.5 1.5" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                매출 정산
            </span>
        </div>

        <h1 class="auth-split__title">강의도, 정산도,<br>여기서 한번에</h1>
        <p class="auth-split__desc">수강생 관리부터 강의 운영, 매출 정산까지 한 화면에서 이어집니다</p>

    </div>

    <!-- 우측: 새 비밀번호 설정 폼 -->
    <div class="auth-split__form">
        <div class="auth-container">

            <!-- 로고 -->
            <div class="auth-logo">DJ테크트리</div>

            <!-- 소개 영역 -->
            <div class="auth-reset-intro">
                <h2 class="auth-reset-intro__title">
                    <span class="auth-reset-intro__role">{강사/관리자}</span> 로그인을 위한<br>새 비밀번호를 설정하세요
                </h2>
                <p class="auth-reset-intro__desc">보안을 위해 이전에 사용하지 않은 새로운 비밀번호를<br>설정해 주세요.</p>
            </div>

            <!-- 폼 영역 -->
            <div class="auth-body">
                <hr class="auth-divider">

                <!-- 새 비밀번호 -->
                <div class="auth-field-group">
                    <label class="auth-field-label" for="new-password">새 비밀번호</label>
                    <div class="auth-field">
                        <img src="../../images/form-ico-lock.svg" width="16" height="16" alt="">
                        <input type="password" id="new-password" class="auth-field__input" placeholder="새 비밀번호를 입력하세요">
                        <button type="button" class="auth-field__eye" onclick="togglePassword(this, 'new-password')">
                            <img src="../../images/form-ico-eye.svg" width="16" height="16" alt="비밀번호 표시">
                        </button>
                    </div>
                    <div class="auth-strength">
                        <div class="auth-strength__bars">
                            <div class="auth-strength__bar auth-strength__bar--on"></div>
                            <div class="auth-strength__bar auth-strength__bar--on"></div>
                            <div class="auth-strength__bar auth-strength__bar--on"></div>
                            <div class="auth-strength__bar"></div>
                        </div>
                    </div>
                    <p class="auth-field-hint">8~16자, 영문 대소문자·숫자·특수문자 조합 필수</p>
                </div>

                <!-- 새 비밀번호 확인 -->
                <div class="auth-field-group">
                    <label class="auth-field-label" for="new-password-confirm">새 비밀번호 확인</label>
                    <div class="auth-field">
                        <img src="../../images/form-ico-lock.svg" width="16" height="16" alt="">
                        <input type="password" id="new-password-confirm" class="auth-field__input" placeholder="비밀번호를 한번 더 입력하세요.">
                        <button type="button" class="auth-field__eye" onclick="togglePassword(this, 'new-password-confirm')">
                            <img src="../../images/form-ico-eye.svg" width="16" height="16" alt="비밀번호 표시">
                        </button>
                    </div>
                </div>
            </div>

            <!-- 버튼 및 기타 -->
            <div class="auth-footer">
                <button type="button" class="btn big" disabled>비밀번호 변경 완료</button>
                <hr class="auth-divider">
                <p class="auth-help auth-help--back">
                    <img src="../../images/arrow-right-auth.svg" width="16" height="16" alt="">
                    <span><a href="login-visual.html">로그인</a> 화면으로 돌아가기</span>
                </p>
            </div>

        </div>
    </div>

</div>

<script>
function togglePassword(btn, targetId) {
    var input = document.getElementById(targetId);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.style.opacity = input.type === 'text' ? '1' : '';
}
</script>

</body>
</html>

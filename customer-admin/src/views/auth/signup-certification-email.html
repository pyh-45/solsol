<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증 메일 발송</title>
    <link rel="stylesheet" href="../../../css/base.css">
</head>
<body>

<div class="c-modal-overlay">
    <div class="c-modal c-modal--gap20">

        <!-- 로고 -->
        <div class="c-modal__logo">DJ테크트리</div>

        <!-- 내용 -->
        <div class="c-modal__content">
            <p class="c-modal__title">인증 메일을 발송했습니다.</p>
            <p class="c-modal__desc"><strong>{강사/운영자 이메일 주소}</strong>로<br>인증코드를 포함한 이메일을 발송했습니다.<br>메일함을 확인하고 인증코드를 입력해 주세요.</p>
            <hr class="auth-divider">
            <ul class="c-modal__info-list">
                <li>인증코드는 <strong>10분간</strong> 유효합니다. 시간 내에 입력해 주세요.</li>
                <li>메일이 보이지 않는다면 <strong>스팸 메일함</strong>을 확인해 보세요.</li>
                <li>발신 주소: <strong>{최종관리자 이메일}</strong></li>
            </ul>
            <div class="c-modal__timer">
                <span class="c-modal__timer-label">남은 유효시간</span>
                <span class="c-modal__timer-value">02:47</span>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="c-modal__footer">
            <button class="btn lg">확인</button>
        </div>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증코드 발송 메일</title>
</head>
<body style="margin:0; padding:0; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:14px; color:#333333; background:#FFFFFF; -webkit-font-smoothing:antialiased;">

<div style="min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:60px 20px; background:#FFFFFF; box-sizing:border-box;">
    <div style="width:560px; background:#FFFFFF; border-radius:12px; padding:40px; display:flex; flex-direction:column; gap:20px; box-sizing:border-box;">

        <!-- 1. 이메일 타이틀 -->
        <div style="position:relative; height:120px; background-color:#4FC0FC; display:flex; align-items:center; justify-content:center; color:#FFFFFF; font-size:24px; font-weight:800; letter-spacing:-0.24px; overflow:hidden;">
            <span>DJ테크트리</span>
            <img src="../../images/email-top-bg.png" alt="" style="position:absolute; right:0; top:0; height:100%; width:auto; opacity:0.1; pointer-events:none;">
        </div>

        <!-- 2. 제목 + 안내텍스트 영역 -->
        <div style="display:flex; flex-direction:column; gap:20px;">
            <h1 style="margin:0; font-size:24px; font-weight:700; color:#333333; line-height:1.4; letter-spacing:-0.02em;">이메일</h1>
            <div>
                <p style="margin:10px 0; font-size:16px; font-weight:600; color:#333333;"><strong>안녕하세요. {사이트명}입니다.</strong></p>
                <p style="margin:0; font-size:14px; color:#666666; line-height:1.5;">
                    회원가입을 위한 이메일 인증코드가 발급되었습니다.<br>
                    아래 인증코드를 입력하여 이메일 인증을 완료해 주세요.
                </p>
            </div>
        </div>

        <hr style="border:none; border-top:1px solid #EAEAEA; margin:0;">

        <!-- 3. 인증코드 + 안내 영역 -->
        <div style="display:flex; flex-direction:column; gap:20px;">
            <div style="display:flex; justify-content:center; gap:6px;">
                <div style="padding:13px 25px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#222222; background:#F5F8FF; border:1.5px solid #4FC0FC; border-radius:10px;">3</div>
                <div style="padding:13px 25px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#222222; background:#F5F8FF; border:1.5px solid #4FC0FC; border-radius:10px;">5</div>
                <div style="padding:13px 25px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#222222; background:#F5F8FF; border:1.5px solid #4FC0FC; border-radius:10px;">7</div>
                <div style="padding:13px 25px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#222222; background:#F5F8FF; border:1.5px solid #4FC0FC; border-radius:10px;">6</div>
                <div style="padding:13px 25px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#222222; background:#F5F8FF; border:1.5px solid #4FC0FC; border-radius:10px;">9</div>
                <div style="padding:13px 25px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#222222; background:#F5F8FF; border:1.5px solid #4FC0FC; border-radius:10px;">0</div>
            </div>
            <p style="margin:-10px 0 0; font-size:12px; color:#FF0000; text-align:center;">위 인증코드가 <strong style="color:#FF0000; font-weight:600;">이메일</strong>로 발송되었습니다.</p>
            <div style="display:flex; align-items:flex-start; gap:10px; background:#EBF5FF; border-radius:8px; padding:14px 16px;">
                <img src="../../images/ico-info-circle.svg" width="16" height="16" alt="" style="flex-shrink:0; margin-top:2px;">
                <p style="margin:0; font-size:13px; color:#4FC0FC; line-height:1.5;">
                    <strong>인증코드는 발송 후 10분간 유효합니다.</strong><br>
                    시간이 초과된 경우 인증코드 재발송을 요청해 주세요.
                </p>
            </div>
        </div>

        <hr style="border:none; border-top:1px solid #EAEAEA; margin:0;">

        <!-- 4. 보안 안내 영역 -->
        <div style="display:flex; flex-direction:column; gap:20px;">
            <div style="background:#FFF; border:1px solid #D2D6E1; border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px;">
                <p style="margin:0; font-size:13px; font-weight:700; color:#333333;">보안 안내</p>
                <ul style="list-style:disc; padding-left:18px; margin:0; display:flex; flex-direction:column; gap:3px;">
                    <li style="font-size:12px; color:#666666; line-height:1.2;">인증코드를 타인에게 알려주지 마세요.</li>
                    <li style="font-size:12px; color:#666666; line-height:1.2;">본 메일을 요청하지 않으셨다면 즉시 관리자에게 알려 주세요.</li>
                    <li style="font-size:12px; color:#666666; line-height:1.2;">본 메일에 개인 정보 입력을 요구하는 내용은 포함되어 있지 않습니다.</li>
                </ul>
            </div>
        </div>

    </div>
</div>

</body>
</html>

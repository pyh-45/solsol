<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜딩페이지 미리보기 (기본형)</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body style="background:#888; padding:60px 0;">

<div style="display:flex; justify-content:center; padding:0 30px;">

    <!-- ========= 랜딩페이지 미리보기 모달 (W800) ========= -->
    <div class="c-modal completion-modal completion-modal--xl">
        <div class="completion-modal__header completion-modal__header--close-only">
            <button type="button" class="completion-modal__close" aria-label="닫기">
                <img src="../../../images/btn-modal-close.svg" width="24" height="24" alt="">
            </button>
        </div>

        <div class="c-modal__content completion-modal__body">

            <!-- 사이트명 -->
            <div class="auth-logo preview-form__logo">DJ테크트리</div>

            <!-- 메인 헤드라인 + 서브 타이틀 -->
            <div class="preview-form__heading-group">
                <h3 class="preview-form__title">{메인 헤드라인}</h3>
                <p class="preview-form__subtitle">{서브 타이틀}</p>
            </div>

            <!-- 본문 내용 박스 -->
            <div class="preview-form__intro">
                내용 들어갑니다.
            </div>

        </div>

        <!-- 푸터 -->
        <div class="c-modal__footer">
            <button type="button" class="btn big" style="width:100%;">가입하러 가기</button>
        </div>

    </div>

</div>

</body>
</html>

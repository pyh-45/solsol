<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문참여독려</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body>

<div class="c-modal-overlay">
    <div class="c-modal completion-modal">

        <!-- 헤더 -->
        <div class="completion-modal__header">
            <h3 class="completion-modal__heading">설문에 참여하세요</h3>
            <button type="button" class="completion-modal__close" aria-label="닫기">
                <img src="../../../images/btn-modal-close.svg" width="24" height="24" alt="">
            </button>
        </div>

        <div class="c-modal__content completion-modal__body">

            <!-- 안내 문구 -->
            <div class="ai-result-text">
                <p class="ai-result-text__title">{설문명}</p>
            </div>

            <!-- 이미지 영역 -->
            <div class="encourage-image">
                <span class="encourage-image__placeholder">images</span>
            </div>

            <!-- 설문 정보 -->
            <p class="encourage-info">
                설문 기간 : <span class="encourage-info__value">2000.00.00 2000.00.00</span><br>
                설문 대상 : <span class="encourage-info__value">누구나 / 회원만</span>
            </p>

        </div>

        <!-- 푸터 -->
        <div class="c-modal__footer">
            <button type="button" class="btn big">참여하기</button>
        </div>

    </div>
</div>

</body>
</html>

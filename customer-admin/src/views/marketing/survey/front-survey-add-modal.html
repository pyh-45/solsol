<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문 추가</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body style="background:#888; padding:60px 0;">

<div style="display:flex; justify-content:center;">

    <div class="c-modal completion-modal">

        <!-- 헤더 -->
        <div class="completion-modal__header">
            <h3 class="completion-modal__heading">설문 추가</h3>
            <button type="button" class="completion-modal__close" aria-label="닫기">
                <img src="../../../images/btn-modal-close.svg" width="24" height="24" alt="">
            </button>
        </div>

        <div class="c-modal__content c-modal__content--pb10 completion-modal__body">

            <!-- 설문 항목 리스트 -->
            <div class="recipient-group-list">
                <label class="recipient-group-item">
                    <input type="checkbox" class="table-check">
                    <span class="recipient-group-item__name">이메일</span>
                </label>
                <label class="recipient-group-item">
                    <input type="checkbox" class="table-check">
                    <span class="recipient-group-item__name">전화번호</span>
                </label>
                <label class="recipient-group-item">
                    <input type="checkbox" class="table-check">
                    <span class="recipient-group-item__name">텍스트(단답형)</span>
                </label>
                <label class="recipient-group-item">
                    <input type="checkbox" class="table-check">
                    <span class="recipient-group-item__name">텍스트(장문형)</span>
                </label>
                <label class="recipient-group-item">
                    <input type="checkbox" class="table-check">
                    <span class="recipient-group-item__name">단일 선택</span>
                </label>
                <label class="recipient-group-item">
                    <input type="checkbox" class="table-check">
                    <span class="recipient-group-item__name">다중 선택</span>
                </label>
            </div>

        </div>

        <!-- 푸터 -->
        <div class="c-modal__footer">
            <button type="button" class="btn big">확인</button>
        </div>

    </div>

</div>

<script>
    function toggleDropdown(trigger) {
        const isOpen = trigger.classList.contains('open');
        document.querySelectorAll('.c-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) trigger.classList.add('open');
    }

    function selectItem(item) {
        const panel = item.closest('.c-dropdown__panel');
        panel.querySelectorAll('.c-dropdown__item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        const trigger = panel.previousElementSibling;
        trigger.querySelector('.c-dropdown__label').textContent = item.textContent;
        trigger.classList.remove('open');
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습기간 설정</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body>

<div class="c-modal-overlay">
    <div class="c-modal completion-modal completion-modal--lg">

        <!-- 헤더 -->
        <div class="completion-modal__header">
            <h3 class="completion-modal__heading">학습기간 설정</h3>
            <button type="button" class="completion-modal__close" aria-label="닫기">
                <img src="../../../images/btn-modal-close.svg" width="24" height="24" alt="">
            </button>
        </div>

        <div class="c-modal__content c-modal__content--pb10 completion-modal__body">

            <!-- 안내 인포박스 -->
            <div class="admin-infotip">
                <span class="admin-infotip__icon">i</span>
                <span class="admin-infotip__text">수강기간이 무제한인 경우, 수강 종료 날짜 지정 방식만 가능합니다.</span>
            </div>
            <div>
                <!-- 학습자 선택 타이틀 -->
                <h4 class="tutor-pick-list__title">{n}개 학습자 선택됨</h4>
                <!-- 수정 방법 테이블 -->
                <table class="modal-info-table">
                    <tbody>
                        <tr>
                            <th>수정 방법</th>
                            <td>
                                <div style="display:flex; flex-direction:column;gap: 20px;">

                                    <!-- 1-1. 입력한 기간으로 추가 연장 -->
                                    <div>
                                        <label class="c-radio">
                                            <input type="radio" name="periodMethod" checked>
                                            <span>입력한 기간으로 추가 연장</span>
                                        </label>
                                        <div class="input-with-unit" style="margin-top:8px;">
                                            <input type="text" class="detail-form__input" placeholder="연장할 기간을 입력해 주세요.">
                                            <span class="input-with-unit__suffix">일</span>
                                        </div>
                                        <p class="modal-info-table__hint">최대 365일까지 입력 가능하며, 기존 수강 종료일로부터 입력한 일자 만큼 수강 종료 기간이 연장됩니다.</p>
                                    </div>

                                    <!-- 1-2. 수강 종료 날짜 지정 -->
                                    <div>
                                        <label class="c-radio">
                                            <input type="radio" name="periodMethod">
                                            <span>수강 종료 날짜 지정</span>
                                        </label>
                                        <div style="margin-top:8px;">
                                            <div class="c-date-input" onclick="toggleCalendar(this)">
                                                <input type="text" value="26. 03. 12" readonly>
                                                <img class="c-date-input__ico" src="../../../images/ico-form-calendar.svg" width="20" height="20" alt="">
                                            </div>
                                        </div>
                                        <p class="modal-info-table__hint">지정된 날짜로 수강 종료기간이 변경됩니다.</p>
                                    </div>

                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="c-modal__footer">
            <button type="button" class="btn big">확인</button>
        </div>

    </div>

    <!-- ===== 오른쪽 얼럿 모달 갤러리 (디자인 확인용, 기능 없음) ===== -->
    <div style="display:flex; flex-direction:column; gap:16px; margin-left:24px;">

        <!-- 1-a : 학습기간 일괄 변경 확인 -->
        <div class="c-modal">
            <div class="c-modal__content">
                <div class="c-modal__icon-wrap c-modal__icon-wrap--notice">
                    <img src="../../../images/ico-modal-notice.svg" width="36" height="36" alt="">
                </div>
                <p class="c-modal__desc">{n}개 학습자의 학습기간을 일괄 변경하시겠어요?</p>
            </div>
            <div class="c-modal__footer c-modal__footer--split">
                <button type="button" class="btn lg border">취소</button>
                <button type="button" class="btn lg">확인</button>
            </div>
        </div>

        <!-- 1-b : 학습기간 변경 완료 -->
        <div class="c-modal">
            <div class="c-modal__content">
                <div class="c-modal__icon-wrap">
                    <img src="../../../images/ico-modal-success.svg" width="36" height="36" alt="">
                </div>
                <p class="c-modal__desc">선택하신 학습자의 학습기간이 변경되었습니다</p>
            </div>
            <div class="c-modal__footer">
                <button type="button" class="btn lg">확인</button>
            </div>
        </div>

    </div>
</div>

<script>
    function toggleCalendar(wrap) {
        const cal = document.getElementById('datePopupCalendar');
        if (!cal) return;
        const isCurrent = cal.dataset.target === wrap.dataset.calId;
        if (cal.classList.contains('is-open') && isCurrent) {
            cal.classList.remove('is-open');
            return;
        }
        const id = wrap.dataset.calId || ('cal-' + Math.random().toString(36).slice(2, 8));
        wrap.dataset.calId = id;
        const rect = wrap.getBoundingClientRect();
        cal.style.top = (rect.bottom + window.scrollY + 4) + 'px';
        cal.style.left = (rect.left + window.scrollX) + 'px';
        cal.classList.add('is-open');
        cal.dataset.target = id;
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.c-date-input') && !e.target.closest('.c-calendar')) {
            document.getElementById('datePopupCalendar')?.classList.remove('is-open');
        }
    });
</script>

    <!-- 날짜 선택 팝업 달력 -->
    <div class="c-calendar c-calendar--popup" id="datePopupCalendar">
        <div class="c-calendar__header">
            <button class="c-calendar__nav" aria-label="이전 달">
                <img src="../../../images/arrow-calendar-disabled.svg" width="20" height="20" alt="">
            </button>
            <span class="c-calendar__title">May, 2026</span>
            <button class="c-calendar__nav" aria-label="다음 달">
                <img src="../../../images/arrow-calendar-active.svg" width="20" height="20" alt="">
            </button>
        </div>
        <div class="c-calendar__weekdays">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="c-calendar__grid">
            <button class="c-calendar__day c-calendar__day--muted">27</button>
            <button class="c-calendar__day c-calendar__day--muted">28</button>
            <button class="c-calendar__day c-calendar__day--muted">29</button>
            <button class="c-calendar__day c-calendar__day--muted">30</button>
            <button class="c-calendar__day">1</button>
            <button class="c-calendar__day">2</button>
            <button class="c-calendar__day">3</button>
            <button class="c-calendar__day">4</button>
            <button class="c-calendar__day">5</button>
            <button class="c-calendar__day">6</button>
            <button class="c-calendar__day">7</button>
            <button class="c-calendar__day">8</button>
            <button class="c-calendar__day">9</button>
            <button class="c-calendar__day">10</button>
            <button class="c-calendar__day">11</button>
            <button class="c-calendar__day">12</button>
            <button class="c-calendar__day">13</button>
            <button class="c-calendar__day">14</button>
            <button class="c-calendar__day">15</button>
            <button class="c-calendar__day">16</button>
            <button class="c-calendar__day">17</button>
            <button class="c-calendar__day">18</button>
            <button class="c-calendar__day">19</button>
            <button class="c-calendar__day">20</button>
            <button class="c-calendar__day">21</button>
            <button class="c-calendar__day">22</button>
            <button class="c-calendar__day">23</button>
            <button class="c-calendar__day">24</button>
            <button class="c-calendar__day">25</button>
            <button class="c-calendar__day">26</button>
            <button class="c-calendar__day c-calendar__day--today">27</button>
            <button class="c-calendar__day">28</button>
            <button class="c-calendar__day">29</button>
            <button class="c-calendar__day">30</button>
            <button class="c-calendar__day">31</button>
            <button class="c-calendar__day c-calendar__day--muted">1</button>
            <button class="c-calendar__day c-calendar__day--muted">2</button>
            <button class="c-calendar__day c-calendar__day--muted">3</button>
            <button class="c-calendar__day c-calendar__day--muted">4</button>
            <button class="c-calendar__day c-calendar__day--muted">5</button>
            <button class="c-calendar__day c-calendar__day--muted">6</button>
        </div>
    </div>

</body>
</html>

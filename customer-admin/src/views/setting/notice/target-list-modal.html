<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노출대상 리스트</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body>

<div class="c-modal-overlay">
    <div class="c-modal completion-modal">

        <div class="completion-modal__header">
            <h3 class="completion-modal__heading">노출대상 리스트</h3>
            <button type="button" class="completion-modal__close" aria-label="닫기">
                <img src="../../../images/btn-modal-close.svg" width="24" height="24" alt="">
            </button>
        </div>

        <div class="c-modal__content completion-modal__body" style="padding-bottom:24px;">

            <p class="search-result-count search-result-count--total">총 <strong>28</strong>개</p>

            <!-- 강사/관리자 목록 -->
            <div class="tutor-pick-list">
                <div class="tutor-pick-list__scroll">
                <table class="modal-table tutor-pick-table">
                    <colgroup>
                        <col>
                        <col style="width:90px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>정보</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <div class="tutor-pick-info">
                                    <span class="c-avatar22 manager"></span>
                                    <span class="role-badge role-badge--manager">관리자</span>
                                    <span class="tutor-pick-info__name">닉네임</span>
                                    <span class="tutor-pick-info__email">example@example.com</span>
                                </div>
                            </td>
                            <td><span style="color:var(--text-tertiary);">확인</span></td>
                        </tr>
                        <tr>
                            <td>
                                <div class="tutor-pick-info">
                                    <span class="c-avatar22 basic"></span>
                                    <span class="role-badge role-badge--instructor">강사</span>
                                    <span class="tutor-pick-info__name">alpha_user_kr</span>
                                    <span class="tutor-pick-info__email">example@example.com</span>
                                </div>
                            </td>
                            <td><strong style="color:var(--text-primary);">미확인</strong></td>
                        </tr>
                        <tr>
                            <td>
                                <div class="tutor-pick-info">
                                    <span class="c-avatar22 sub-teacher"></span>
                                    <span class="role-badge role-badge--sub">서브강사</span>
                                    <span class="tutor-pick-info__name">닉네임</span>
                                    <span class="tutor-pick-info__email">example@example.com</span>
                                </div>
                            </td>
                            <td><span style="color:var(--text-tertiary);">확인</span></td>
                        </tr>
                        <tr>
                            <td>
                                <div class="tutor-pick-info">
                                    <span class="c-avatar22 manager"></span>
                                    <span class="role-badge role-badge--manager">관리자</span>
                                    <span class="tutor-pick-info__name">닉네임</span>
                                    <span class="tutor-pick-info__email">example@example.com</span>
                                </div>
                            </td>
                            <td><span style="color:var(--text-tertiary);">확인</span></td>
                        </tr>
                        <tr>
                            <td>
                                <div class="tutor-pick-info">
                                    <span class="c-avatar22 basic"></span>
                                    <span class="role-badge role-badge--instructor">강사</span>
                                    <span class="tutor-pick-info__name">alpha_user_kr</span>
                                    <span class="tutor-pick-info__email">example@example.com</span>
                                </div>
                            </td>
                            <td><span style="color:var(--text-tertiary);">확인</span></td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 연결</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body>

<div class="c-modal-overlay">
    <div class="c-modal completion-modal completion-modal--xl">

        <div class="completion-modal__header">
            <h3 class="completion-modal__heading">게시판 연결</h3>
            <button type="button" class="completion-modal__close" aria-label="닫기">
                <img src="../../../images/btn-modal-close.svg" width="24" height="24" alt="">
            </button>
        </div>

        <div class="c-modal__content completion-modal__body" style="padding-bottom:24px;">

            <!-- 안내 인포 -->
            <div class="admin-infotip">
                <span class="admin-infotip__icon">i</span>
                <span class="admin-infotip__text">원하시는 게시판 1개를 선택하여 메뉴를 생성할 수 있습니다<br>페이지는 1개만 선택 가능합니다</span>
            </div>

            <!-- 검색 + 필터 -->
            <div class="search-filter-bar">
                <div class="tutor-search" style="flex:1;">
                    <img src="../../../images/Ico-search.svg" width="20" height="20" alt="">
                    <input type="text" class="tutor-search__input" placeholder="게시판명 검색">
                </div>
                <div class="c-dropdown">
                    <button class="c-dropdown__trigger" onclick="toggleDropdown(this)">
                        <span class="c-dropdown__label">전체 상품유형</span>
                        <img src="../../../images/chevron-down.svg" width="24" height="24" alt="" class="c-dropdown__arrow">
                    </button>
                    <div class="c-dropdown__panel" style="right:0; left:auto;">
                        <button class="c-dropdown__item active" onclick="selectItem(this)">전체 상품유형</button>
                        <button class="c-dropdown__item" onclick="selectItem(this)">공지사항</button>
                        <button class="c-dropdown__item" onclick="selectItem(this)">FAQ</button>
                        <button class="c-dropdown__item" onclick="selectItem(this)">자유게시판</button>
                        <button class="c-dropdown__item" onclick="selectItem(this)">프리미엄 커뮤니티</button>
                    </div>
                </div>
            </div>

            <p class="search-result-count" style="margin-bottom:-6px;">검색결과 <strong>0</strong>개</p>

            <!-- 게시판 목록 -->
            <div class="tutor-pick-list">
                <div class="tutor-pick-list__scroll">
                <table class="admin-table tutor-pick-table">
                    <colgroup>
                        <col style="width:30px;">
                        <col>
                        <col style="width:140px;">
                        <col style="width:100px;">
                        <col style="width:100px;">
                        <col style="width:200px;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th style="text-align:center;"><input type="checkbox" class="table-check"></th>
                            <th>게시판명</th>
                            <th>유형</th>
                            <th>게시글 수</th>
                            <th>공개상태</th>
                            <th>등록일</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="text-align:center;"><input type="checkbox" class="table-check"></td>
                            <td>공지사항</td>
                            <td>공지사항</td>
                            <td>30 개</td>
                            <td><span class="status-chip status-chip--success">공개</span></td>
                            <td>2000.00.00 오전/오후 00:00</td>
                        </tr>
                        <tr>
                            <td style="text-align:center;"><input type="checkbox" class="table-check"></td>
                            <td>FAQ</td>
                            <td>FAQ</td>
                            <td>30 개</td>
                            <td><span class="status-chip status-chip--success">공개</span></td>
                            <td>2000.00.00 오전/오후 00:00</td>
                        </tr>
                        <tr>
                            <td style="text-align:center;"><input type="checkbox" class="table-check"></td>
                            <td>자유게시판</td>
                            <td>자유게시판</td>
                            <td>30 개</td>
                            <td><span class="status-chip status-chip--neutral">비공개</span></td>
                            <td>2000.00.00 오전/오후 00:00</td>
                        </tr>
                        <tr>
                            <td style="text-align:center;"><input type="checkbox" class="table-check"></td>
                            <td>{프리미엄 커뮤니티 게시판명}</td>
                            <td>프리미엄 커뮤니티</td>
                            <td>30 개</td>
                            <td><span class="status-chip status-chip--neutral">비공개</span></td>
                            <td>2000.00.00 오전/오후 00:00</td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <div class="modal-pagination">
                <button type="button" class="pagination__btn" disabled>‹</button>
                <button type="button" class="pagination__btn active">1</button>
                <button type="button" class="pagination__btn">2</button>
                <button type="button" class="pagination__btn">3</button>
                <button type="button" class="pagination__btn">4</button>
                <button type="button" class="pagination__btn">5</button>
                <button type="button" class="pagination__btn">›</button>
            </div>

            <!-- 선택된 게시판 -->
            <div class="tutor-selected">
                <h4 class="tutor-selected__title" style="color:var(--text-primary);">선택된 게시판 {n}</h4>
                <div class="tutor-selected__tags">
                    <span class="user-tag user-tag--plain">
                        {게시판명}
                        <button type="button" class="user-tag__remove" aria-label="삭제">×</button>
                    </span>
                </div>
            </div>

        </div>

        <div class="c-modal__footer">
            <button type="button" class="btn big">확인</button>
        </div>

    </div>
</div>

<script>
    function toggleDropdown(trigger) {
        const isOpen = trigger.classList.contains('open');
        document.querySelectorAll('.c-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) trigger.classList.add('open');
    }

    function selectItem(item) {
        const panel = item.closest('.c-dropdown__panel');
        panel.querySelectorAll('.c-dropdown__item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        const trigger = panel.previousElementSibling;
        trigger.querySelector('.c-dropdown__label').textContent = item.textContent;
        trigger.classList.remove('open');
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.c-dropdown')) {
            document.querySelectorAll('.c-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        }
    });
</script>

</body>
</html>

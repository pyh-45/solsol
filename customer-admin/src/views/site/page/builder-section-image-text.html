<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 편집 - 빌더 (이미지 + 텍스트)</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body>

<div class="bd-page">

    <!-- ===== HEADER ===== -->
    <header class="bd-page__header">
        <div class="bd-page__header-left">
            <button type="button" class="bd-page__back" aria-label="뒤로">
                <img src="../../../images/arrow-back-title.svg" width="20" height="20" alt="">
            </button>
            <h1 class="bd-page__title">페이지 편집</h1>
            <span class="btn xs dark"><span class="guide-ico">i</span> 가이드</span>
            <span class="bd-page__spacer"></span>
            <button type="button" class="btn sm primary">+ 생성</button>
        </div>
        <div class="bd-page__header-right">
            <h2 class="bd-page__pagename">{페이지명}</h2>
            <div class="dashboard-bar__btn-group">
                <button type="button" class="btn sm border btn--icon">
                    <img src="../../../images/ico-16px-view.svg" width="16" height="16" alt="">
                    미리보기
                </button>
                <button type="button" class="btn sm primary">저장</button>
            </div>
        </div>
    </header>

    <!-- ===== BODY ===== -->
    <div class="bd-page__body">

        <!-- 좌측 패널 -->
        <aside class="bd-page__aside">
            <button type="button" class="bd-btn-blueline bd-btn-blueline--full">빈페이지로 만들기</button>

            <div class="bd-aside-group">
                <div class="bd-tab">
                    <div class="bd-tab__item">템플릿 선택</div>
                    <div class="bd-tab__item bd-tab__item--active">섹션 선택</div>
                </div>
                <div class="bd-aside-panel">
                    <div class="bd-search-row">
                        <div class="bd-dropdown bd-dropdown--block" style="flex:1; min-width:0;">
                            <button type="button" class="bd-dropdown__trigger" onclick="toggleBdDropdown(this)">
                                <span class="bd-dropdown__label">섹션 선택</span>
                                <img src="../../../images/chevron-down.svg" width="24" height="24" alt="" class="bd-dropdown__arrow">
                            </button>
                            <div class="bd-dropdown__panel">
                                <button type="button" class="bd-dropdown__item">전체 이미지 배너</button>
                                <button type="button" class="bd-dropdown__item">텍스트</button>
                                <button type="button" class="bd-dropdown__item">상품</button>
                                <button type="button" class="bd-dropdown__item">게시판</button>
                                <button type="button" class="bd-dropdown__item">로케이션</button>
                                <button type="button" class="bd-dropdown__item">후기</button>
                                <button type="button" class="bd-dropdown__item">설문</button>
                                <button type="button" class="bd-dropdown__item">상품</button>
                                <button type="button" class="bd-dropdown__item active">이미지 + 텍스트</button>
                            </div>
                        </div>
                        <button type="button" class="bd-btn-add">추가</button>
                    </div>
                </div>
            </div>

            <!-- ============ 이미지 + 텍스트 에디터 ============ -->
            <div class="bd-editor">
                <div class="bd-editor__header">
                    <button type="button" class="bd-editor__menu" aria-label="펼치기/접기" onclick="toggleBdEditor(this)">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 5h14M3 10h14M3 15h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="bd-editor__title">이미지 + 텍스트</span>
                </div>
                <div class="bd-editor__body">
                    <!-- 이미지 -->
                    <div class="bd-field">
                        <span class="bd-field__label">이미지</span>
                        <div class="bd-img-placeholder">이미지 없음</div>
                        <button type="button" class="bd-btn-line bd-btn-line--full">파일 업로드</button>
                    </div>
                    <!-- 이미지 사이즈 -->
                    <div class="bd-field">
                        <span class="bd-field__label">이미지 사이즈</span>
                        <div class="bd-input-group">
                            <div class="bd-input"><input class="bd-input__field" type="text" placeholder="가로"><span class="bd-input__suffix">px</span></div>
                            <div class="bd-input"><input class="bd-input__field" type="text" placeholder="세로"><span class="bd-input__suffix">px</span></div>
                        </div>
                    </div>
                    <!-- 타이틀 -->
                    <div class="bd-field">
                        <span class="bd-field__label">타이틀</span>
                        <div class="bd-input"><input class="bd-input__field" type="text" placeholder="이미지 위에 레이어 되는 타이틀을 작성하세요."></div>
                    </div>
                    <!-- 설명 (리치텍스트) -->
                    <div class="bd-field">
                        <span class="bd-field__label">설명</span>
                        <div class="bd-rte">
                            <div class="bd-rte__toolbar">
                                <button type="button" class="bd-rte__btn" title="굵게"><b>B</b></button>
                                <button type="button" class="bd-rte__btn bd-rte__btn--italic" title="기울임"><i>I</i></button>
                                <button type="button" class="bd-rte__btn bd-rte__btn--underline" title="밑줄">U</button>
                                <span class="bd-rte__divider"></span>
                                <button type="button" class="bd-rte__btn" title="왼쪽 정렬">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h8M2 12h12" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></svg>
                                </button>
                                <button type="button" class="bd-rte__btn" title="가운데 정렬">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M4 8h8M2 12h12" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></svg>
                                </button>
                                <button type="button" class="bd-rte__btn" title="오른쪽 정렬">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6 8h8M2 12h12" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></svg>
                                </button>
                                <span class="bd-rte__divider"></span>
                                <button type="button" class="bd-rte__btn" title="글머리 기호">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="3" cy="4" r="1" fill="#222"/><circle cx="3" cy="8" r="1" fill="#222"/><circle cx="3" cy="12" r="1" fill="#222"/><path d="M6 4h8M6 8h8M6 12h8" stroke="#222" stroke-width="1.4" stroke-linecap="round"/></svg>
                                </button>
                                <button type="button" class="bd-rte__btn" title="번호 매기기">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3v3M1.5 3h1M2 6h.6M6 4h8M6 8h8M6 12h8M2 11h1v1H2v.5h1.5" stroke="#222" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </button>
                                <span class="bd-rte__divider"></span>
                                <button type="button" class="bd-rte__btn" title="서식 지우기">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 3h7l-2 7M5 13h5M3 3l10 10" stroke="#222" stroke-width="1.4" stroke-linecap="round"/></svg>
                                </button>
                            </div>
                            <textarea class="bd-rte__field" rows="5" placeholder="이미지 위에 레이어 됩니다. 타이틀 하단에 삽입되는 짧은 설명문을 작성하세요."></textarea>
                            <span class="bd-rte__counter">0MB 사용중<span class="bd-rte__counter-max"> / 50MB</span></span>
                        </div>
                    </div>
                    <!-- 이미지와 정렬 (좌/우/중간/아래) -->
                    <div class="bd-field">
                        <span class="bd-field__label">이미지와 정렬</span>
                        <div class="bd-segment">
                            <div class="bd-segment__item bd-segment__item--active">좌</div>
                            <div class="bd-segment__item">우</div>
                            <div class="bd-segment__item">중간</div>
                            <div class="bd-segment__item">아래</div>
                        </div>
                    </div>
                    <!-- 배경색 -->
                    <div class="bd-field">
                        <span class="bd-field__label">배경색</span>
                        <div class="bd-color-row">
                            <span class="bd-swatch"><span class="bd-swatch__color" style="background:#676A6E;"></span></span>
                            <div class="bd-rgb-group">
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                            </div>
                        </div>
                    </div>
                    <!-- 블록 삭제 -->
                    <button type="button" class="bd-btn-del bd-btn-del--full">
                        <span class="bd-ico bd-ico--del"></span>블록 삭제
                    </button>
                </div>
            </div>
        </aside>

        <!-- 우측 캔버스 -->
        <main class="bd-page__canvas">
            <img class="bd-preview-img" src="../../../images/front/image-text.png" alt="이미지+텍스트 섹션 프리뷰">
        </main>

    </div>
</div>

<script>
    function toggleBdEditor(btn) {
        const editor = btn.closest('.bd-editor');
        if (editor) editor.classList.toggle('bd-editor--collapsed');
    }
    function toggleBdDropdown(trigger) {
        const isOpen = trigger.classList.contains('open');
        document.querySelectorAll('.bd-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) trigger.classList.add('open');
    }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.bd-dropdown')) {
            document.querySelectorAll('.bd-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        }
    });
</script>

</body>
</html>

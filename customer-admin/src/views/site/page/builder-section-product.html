<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 편집 - 빌더 (상품)</title>
    <link rel="stylesheet" href="../../../../css/base.css">
</head>
<body>

<div class="bd-page">

    <!-- ===== HEADER ===== -->
    <header class="bd-page__header">
        <!-- 좌측: 패널 헤더 -->
        <div class="bd-page__header-left">
            <button type="button" class="bd-page__back" aria-label="뒤로">
                <img src="../../../images/arrow-back-title.svg" width="20" height="20" alt="">
            </button>
            <h1 class="bd-page__title">페이지 편집</h1>
            <span class="btn xs dark"><span class="guide-ico">i</span> 가이드</span>
            <span class="bd-page__spacer"></span>
            <button type="button" class="btn sm primary">+ 생성</button>
        </div>
        <!-- 우측: 캔버스 헤더 -->
        <div class="bd-page__header-right">
            <h2 class="bd-page__pagename">{페이지명}</h2>
            <div class="dashboard-bar__btn-group">
                <button type="button" class="btn sm border btn--icon">
                    <img src="../../../images/ico-16px-view.svg" width="16" height="16" alt="">
                    미리보기
                </button>
                <button type="button" class="btn sm primary">저장</button>
            </div>
        </div>
    </header>

    <!-- ===== BODY (좌우 2단) ===== -->
    <div class="bd-page__body">

        <!-- 좌측 패널 -->
        <aside class="bd-page__aside">
            <!-- 빈페이지로 만들기 -->
            <button type="button" class="bd-btn-blueline bd-btn-blueline--full">빈페이지로 만들기</button>

            <!-- 탭 + 섹션 선택 패널 (붙여서 한 묶음) -->
            <div class="bd-aside-group">
                <div class="bd-tab">
                    <div class="bd-tab__item">템플릿 선택</div>
                    <div class="bd-tab__item bd-tab__item--active">섹션 선택</div>
                </div>
                <div class="bd-aside-panel">
                    <div class="bd-search-row">
                        <!-- 섹션 선택 드롭다운 (클릭 시 팝업) -->
                        <div class="bd-dropdown bd-dropdown--block" style="flex:1; min-width:0;">
                            <button type="button" class="bd-dropdown__trigger" onclick="toggleBdDropdown(this)">
                                <span class="bd-dropdown__label">섹션 선택</span>
                                <img src="../../../images/chevron-down.svg" width="24" height="24" alt="" class="bd-dropdown__arrow">
                            </button>
                            <div class="bd-dropdown__panel">
                                <button type="button" class="bd-dropdown__item">전체 이미지 배너</button>
                                <button type="button" class="bd-dropdown__item">텍스트</button>
                                <button type="button" class="bd-dropdown__item active">상품</button>
                                <button type="button" class="bd-dropdown__item">게시판</button>
                                <button type="button" class="bd-dropdown__item">로케이션</button>
                                <button type="button" class="bd-dropdown__item">후기</button>
                                <button type="button" class="bd-dropdown__item">설문</button>
                                <button type="button" class="bd-dropdown__item">상품</button>
                                <button type="button" class="bd-dropdown__item">이미지 + 텍스트</button>
                            </div>
                        </div>
                        <button type="button" class="bd-btn-add">추가</button>
                    </div>
                </div>
            </div>

            <!-- ============ 상품 에디터 ① (유형: 상품 슬라이드) ============ -->
            <div class="bd-editor">
                <div class="bd-editor__header">
                    <button type="button" class="bd-editor__menu" aria-label="펼치기/접기" onclick="toggleBdEditor(this)">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 5h14M3 10h14M3 15h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="bd-editor__title">상품</span>
                </div>
                <div class="bd-editor__body">
                    <!-- 유형 -->
                    <div class="bd-field">
                        <span class="bd-field__label">유형</span>
                        <div class="bd-dropdown bd-dropdown--block">
                            <button type="button" class="bd-dropdown__trigger" onclick="toggleBdDropdown(this)">
                                <span class="bd-dropdown__label">상품 슬라이드</span>
                                <img src="../../../images/chevron-down.svg" width="24" height="24" alt="" class="bd-dropdown__arrow">
                            </button>
                            <div class="bd-dropdown__panel">
                                <button type="button" class="bd-dropdown__item active">상품 슬라이드</button>
                                <button type="button" class="bd-dropdown__item">상품</button>
                                <button type="button" class="bd-dropdown__item">상품 그리드</button>
                            </div>
                        </div>
                    </div>
                    <hr class="bd-divider">
                    <!-- 제목 -->
                    <div class="bd-field">
                        <span class="bd-field__label">제목</span>
                        <div class="bd-input"><input class="bd-input__field" type="text"></div>
                    </div>
                    <!-- 상품 선택 -->
                    <div class="bd-field">
                        <span class="bd-field__label">상품 선택</span>
                        <button type="button" class="bd-btn-blueline bd-btn-blueline--full">노출 상품 선택</button>
                        <div class="bd-tag">
                            <div class="bd-tag__main">
                                <span class="bd-tag__text">{카테고리명} {상품명}</span>
                            </div>
                            <button type="button" class="bd-tag__close" aria-label="삭제"><span class="bd-ico bd-ico--del"></span></button>
                        </div>
                    </div>
                    <!-- 노출 옵션 -->
                    <div class="bd-field">
                        <span class="bd-field__label">노출 옵션</span>
                        <div class="bd-check-group">
                            <label class="bd-check">
                                <input type="checkbox" class="bd-check__box" checked>
                                <span class="bd-check__text">상품후기</span>
                            </label>
                            <label class="bd-check">
                                <input type="checkbox" class="bd-check__box">
                                <span class="bd-check__text">가격</span>
                            </label>
                            <label class="bd-check">
                                <input type="checkbox" class="bd-check__box">
                                <span class="bd-check__text">모두</span>
                            </label>
                        </div>
                    </div>
                    <!-- 배경색 -->
                    <div class="bd-field">
                        <span class="bd-field__label">배경색</span>
                        <div class="bd-color-row">
                            <span class="bd-swatch"><span class="bd-swatch__color" style="background:#676A6E;"></span></span>
                            <div class="bd-rgb-group">
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                            </div>
                        </div>
                    </div>
                    <!-- 블록 삭제 -->
                    <button type="button" class="bd-btn-del bd-btn-del--full">
                        <span class="bd-ico bd-ico--del"></span>블록 삭제
                    </button>
                </div>
            </div>

            <!-- ============ 상품 에디터 ② (유형: 상품) ============ -->
            <div class="bd-editor">
                <div class="bd-editor__header">
                    <button type="button" class="bd-editor__menu" aria-label="펼치기/접기" onclick="toggleBdEditor(this)">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M3 5h14M3 10h14M3 15h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <span class="bd-editor__title">상품</span>
                </div>
                <div class="bd-editor__body">
                    <!-- 유형 -->
                    <div class="bd-field">
                        <span class="bd-field__label">유형</span>
                        <div class="bd-dropdown bd-dropdown--block">
                            <button type="button" class="bd-dropdown__trigger" onclick="toggleBdDropdown(this)">
                                <span class="bd-dropdown__label">상품</span>
                                <img src="../../../images/chevron-down.svg" width="24" height="24" alt="" class="bd-dropdown__arrow">
                            </button>
                            <div class="bd-dropdown__panel">
                                <button type="button" class="bd-dropdown__item">상품 슬라이드</button>
                                <button type="button" class="bd-dropdown__item active">상품</button>
                                <button type="button" class="bd-dropdown__item">상품 그리드</button>
                            </div>
                        </div>
                    </div>
                    <hr class="bd-divider">
                    <!-- 상품 선택 -->
                    <div class="bd-field">
                        <span class="bd-field__label">상품 선택</span>
                        <button type="button" class="bd-btn-blueline bd-btn-blueline--full">노출 상품 선택</button>
                        <span class="bd-hint bd-hint--info">상품은 2~4개까지 추가할 수 있습니다.</span>
                        <div class="bd-tag">
                            <div class="bd-tag__main">
                                <span class="bd-tag__text">{카테고리명} {상품명}</span>
                            </div>
                            <button type="button" class="bd-tag__close" aria-label="삭제"><span class="bd-ico bd-ico--del"></span></button>
                        </div>
                    </div>
                    <!-- 노출 옵션 -->
                    <div class="bd-field">
                        <span class="bd-field__label">노출 옵션</span>
                        <div class="bd-check-group">
                            <label class="bd-check">
                                <input type="checkbox" class="bd-check__box" checked>
                                <span class="bd-check__text">상품후기</span>
                            </label>
                            <label class="bd-check">
                                <input type="checkbox" class="bd-check__box">
                                <span class="bd-check__text">가격</span>
                            </label>
                            <label class="bd-check">
                                <input type="checkbox" class="bd-check__box">
                                <span class="bd-check__text">모두</span>
                            </label>
                        </div>
                    </div>
                    <!-- 배경색 -->
                    <div class="bd-field">
                        <span class="bd-field__label">배경색</span>
                        <div class="bd-color-row">
                            <span class="bd-swatch"><span class="bd-swatch__color" style="background:#676A6E;"></span></span>
                            <div class="bd-rgb-group">
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                                <span class="bd-rgb-input bd-rgb-input--sm">{RGB값}</span>
                            </div>
                        </div>
                    </div>
                    <!-- 블록 삭제 -->
                    <button type="button" class="bd-btn-del bd-btn-del--full">
                        <span class="bd-ico bd-ico--del"></span>블록 삭제
                    </button>
                </div>
            </div>
        </aside>

        <!-- 우측 캔버스 -->
        <main class="bd-page__canvas">
            <img class="bd-preview-img" src="../../../images/front/product.png" alt="상품 섹션 프리뷰">
        </main>

    </div>
</div>

<script>
    function toggleBdEditor(btn) {
        const editor = btn.closest('.bd-editor');
        if (editor) editor.classList.toggle('bd-editor--collapsed');
    }
    function toggleBdDropdown(trigger) {
        const isOpen = trigger.classList.contains('open');
        document.querySelectorAll('.bd-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) trigger.classList.add('open');
    }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.bd-dropdown')) {
            document.querySelectorAll('.bd-dropdown__trigger.open').forEach(el => el.classList.remove('open'));
        }
    });
</script>

</body>
</html>
